{% load static %}

<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{% static 'students/style.css' %}"
    <title>Search Student</title>
</head>

<body>

<h1>Search Student</h1>

<form method="GET">

    <input type="text"
           name="q"
           placeholder="Enter student name"
           value="{{ query }}">

    <button type="submit">
        Search
    </button>

</form>

<br>

{% for student in students %}

<p>
    <b>{{ student.name }}</b>
    -
    {{ student.marks }}
    -
    {{ student.department }}
</p>

{% empty %}

<p>No matching student found.</p>

{% endfor %}

<br>

<a href="{% url 'home' %}">
    Home
</a>

</body>

</html>
